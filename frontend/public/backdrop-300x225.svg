<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4000 3000" width="4000" height="3000">
  <defs>
    <!-- Navy gradient background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A264F"/>
      <stop offset="50%" stop-color="#22316a"/>
      <stop offset="100%" stop-color="#0F1833"/>
    </linearGradient>

    <!-- Gold gradient for headings -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle gold accent for repeat logo -->
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Single tile of step-and-repeat -->
    <pattern id="repeatLogo" x="0" y="0" width="500" height="375" patternUnits="userSpaceOnUse">
      <g transform="translate(250, 187.5)">
        <!-- Small A icon (matches favicon style) -->
        <g transform="translate(-58, -65)">
          <rect x="0" y="0" width="116" height="116" rx="22" fill="#22316a" opacity="0"/>
          <path d="M 58 14 L 96 100 L 80 100 L 73 84 L 43 84 L 36 100 L 20 100 Z M 50 70 L 66 70 L 58 50 Z"
                fill="url(#goldSoft)"/>
        </g>
        <!-- Brand name underneath -->
        <text x="0" y="80" text-anchor="middle"
              font-family="DejaVu Sans, Outfit, Arial, sans-serif"
              font-size="22" font-weight="800"
              fill="#FCD34D" fill-opacity="0.45"
              letter-spacing="2">
          ARSA YATIRIM ZİRVESİ
        </text>
        <text x="0" y="108" text-anchor="middle"
              font-family="DejaVu Sans, Outfit, Arial, sans-serif"
              font-size="14" font-weight="600"
              fill="#FCD34D" fill-opacity="0.32"
              letter-spacing="4">
          2 0 2 6
        </text>
      </g>
    </pattern>

    <!-- Soft glow -->
    <radialGradient id="centerGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base navy -->
  <rect width="4000" height="3000" fill="url(#bgGrad)"/>

  <!-- Step-and-repeat pattern over entire surface -->
  <rect width="4000" height="3000" fill="url(#repeatLogo)"/>

  <!-- Center radial glow for depth -->
  <rect width="4000" height="3000" fill="url(#centerGlow)"/>

  <!-- TOP gold accent bar -->
  <rect x="0" y="0" width="4000" height="14" fill="url(#goldGrad)"/>

  <!-- BOTTOM gold accent bar -->
  <rect x="0" y="2986" width="4000" height="14" fill="url(#goldGrad)"/>

  <!-- Big center card (hero block) with subtle box around main title -->
  <g transform="translate(2000, 1500)">
    <!-- Soft dark backdrop behind title for legibility -->
    <rect x="-1450" y="-650" width="2900" height="1300" rx="40"
          fill="#1A264F" fill-opacity="0.55"/>

    <!-- Glowing border -->
    <rect x="-1450" y="-650" width="2900" height="1300" rx="40"
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.7"/>

    <!-- Top pill: tagline -->
    <g>
      <rect x="-330" y="-540" width="660" height="80" rx="40"
            fill="none" stroke="#FCD34D" stroke-width="2"/>
      <text x="0" y="-486" text-anchor="middle"
            font-family="DejaVu Sans, Outfit, Arial, sans-serif"
            font-size="38" font-weight="700"
            fill="#FCD34D"
            letter-spacing="8">
        TÜRKİYE'NİN ARSA ZİRVESİ
      </text>
    </g>

    <!-- Main title row -->
    <text x="0" y="-260" text-anchor="middle"
          font-family="DejaVu Serif, Playfair Display, Georgia, serif"
          font-size="260" font-weight="900"
          fill="#ffffff" letter-spacing="-4">
      ARSA YATIRIM
    </text>
    <text x="0" y="-30" text-anchor="middle"
          font-family="DejaVu Serif, Playfair Display, Georgia, serif"
          font-size="260" font-weight="900"
          fill="url(#goldGrad)" letter-spacing="-4">
      ZİRVESİ
    </text>

    <!-- Year highlight band -->
    <g transform="translate(0, 120)">
      <line x1="-1100" y1="0" x2="-260" y2="0" stroke="#FCD34D" stroke-width="3"/>
      <text x="0" y="40" text-anchor="middle"
            font-family="DejaVu Sans, Outfit, Arial, sans-serif"
            font-size="180" font-weight="900"
            fill="#FCD34D" letter-spacing="60">
        2026
      </text>
      <line x1="260" y1="0" x2="1100" y2="0" stroke="#FCD34D" stroke-width="3"/>
    </g>

    <!-- Date + Location -->
    <text x="0" y="290" text-anchor="middle"
          font-family="DejaVu Sans, Outfit, Arial, sans-serif"
          font-size="60" font-weight="600"
          fill="#ffffff"
          letter-spacing="6">
      21 MAYIS 2026 · İSTANBUL
    </text>

    <!-- Venue -->
    <text x="0" y="375" text-anchor="middle"
          font-family="DejaVu Sans, Outfit, Arial, sans-serif"
          font-size="40" font-weight="400"
          fill="#ffffff" fill-opacity="0.75"
          letter-spacing="4">
      HILTON İSTANBUL BOSPHORUS
    </text>

    <!-- Bottom: hashtag + website -->
    <g transform="translate(0, 520)">
      <rect x="-800" y="-50" width="1600" height="90" rx="45"
            fill="#FCD34D"/>
      <text x="0" y="12" text-anchor="middle"
            font-family="DejaVu Sans, Outfit, Arial, sans-serif"
            font-size="46" font-weight="900"
            fill="#22316a"
            letter-spacing="4">
        #ARSAZİRVESİ2026  ·  ARSAYATIRIMZIRVESI.COM
      </text>
    </g>
  </g>

  <!-- Bottom-left organizer credit -->
  <g transform="translate(80, 2890)">
    <text x="0" y="0"
          font-family="DejaVu Sans, Outfit, Arial, sans-serif"
          font-size="22" font-weight="600"
          fill="#FCD34D" fill-opacity="0.7"
          letter-spacing="3">
      ORGANİZASYON: JNR FUARCILIK
    </text>
  </g>

  <!-- Bottom-right sponsor -->
  <g transform="translate(3920, 2890)">
    <text x="0" y="0" text-anchor="end"
          font-family="DejaVu Sans, Outfit, Arial, sans-serif"
          font-size="22" font-weight="600"
          fill="#FCD34D" fill-opacity="0.7"
          letter-spacing="3">
      ANA SPONSOR: FIRAT CONSTRUCTION YAPI A.Ş.
    </text>
  </g>
</svg>
