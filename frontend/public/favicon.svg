<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3D7E"/>
      <stop offset="100%" stop-color="#1A2654"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square -->
  <rect width="64" height="64" rx="12" fill="url(#navyGrad)"/>

  <!-- Bold sans-serif "A" — heavy stroke for small-size legibility -->
  <!-- Outer A shape -->
  <path
    d="M 32 9
       L 53 55
       L 43 55
       L 39 46
       L 25 46
       L 21 55
       L 11 55
       Z"
    fill="url(#goldGrad)"
  />
  <!-- Inner triangle cutout (the hole in A) -->
  <path
    d="M 28 38
       L 36 38
       L 32 28
       Z"
    fill="url(#navyGrad)"
  />
</svg>
